<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AcademiX — Maintenance Mode</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Sora', sans-serif;
      background: #060910;
      color: #eaf0ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    /* Noise */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    }
    /* Grid bg */
    .grid-bg {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.022) 1px, transparent 1px);
      background-size: 54px 54px;
      animation: gridDrift 50s linear infinite;
    }
    @keyframes gridDrift { to { background-position: 54px 54px; } }
    /* Orbs */
    .orb {
      position: fixed; border-radius: 50%; filter: blur(100px);
      pointer-events: none; z-index: 0;
    }
    .orb-1 {
      width: 700px; height: 700px;
      background: radial-gradient(circle, rgba(239,68,68,0.07), transparent 70%);
      top: -350px; left: 50%; transform: translateX(-50%);
      animation: floatA 12s ease-in-out infinite;
    }
    .orb-2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(91,110,245,0.06), transparent 70%);
      bottom: -100px; right: -100px;
      animation: floatB 16s ease-in-out infinite;
    }
    @keyframes floatA { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(50px)} }
    @keyframes floatB { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-30px,-30px)} }
    /* Scan line */
    .scanline {
      position: fixed; left: 0; right: 0; height: 2px; z-index: 2;
      background: linear-gradient(90deg, transparent, rgba(239,68,68,0.45), transparent);
      animation: scanMove 6s ease-in-out infinite;
    }
    @keyframes scanMove {
      0%   { top: 0;     opacity: 0; }
      5%   { opacity: 1; }
      95%  { opacity: 1; }
      100% { top: 100vh; opacity: 0; }
    }
    /* Content */
    .content {
      position: relative; z-index: 10;
      text-align: center;
      padding: 52px 32px;
      max-width: 560px;
      width: 94%;
      animation: fadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(32px); }
      to   { opacity: 1; transform: translateY(0);    }
    }
    /* Icon */
    .icon-ring {
      width: 92px; height: 92px; border-radius: 50%;
      background: rgba(239,68,68,0.07);
      border: 1px solid rgba(239,68,68,0.22);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 32px;
      position: relative;
    }
    .icon-ring::before {
      content: ''; position: absolute; inset: -12px; border-radius: 50%;
      border: 1px dashed rgba(239,68,68,0.16);
      animation: spin 16s linear infinite;
    }
    .icon-ring::after {
      content: ''; position: absolute; inset: -26px; border-radius: 50%;
      border: 1px dashed rgba(239,68,68,0.07);
      animation: spin 32s linear infinite reverse;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* Badge */
    .badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 18px 6px 12px; border-radius: 999px;
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.2);
      font-size: 10px; font-weight: 700; letter-spacing: 0.18em;
      text-transform: uppercase; color: #ef4444;
      margin-bottom: 28px;
    }
    .badge-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #ef4444; box-shadow: 0 0 8px rgba(239,68,68,0.8);
      animation: badgeBlink 1.8s ease-in-out infinite;
    }
    @keyframes badgeBlink { 0%,100%{opacity:1} 50%{opacity:0.2} }
    /* Title */
    .main-title {
      font-size: clamp(28px, 7vw, 46px);
      font-weight: 800; letter-spacing: -0.04em; line-height: 1.1;
      margin-bottom: 16px;
      background: linear-gradient(175deg, #f0f4ff 0%, rgba(240,244,255,0.45) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      font-size: 14px; line-height: 1.8;
      color: rgba(234,240,255,0.4);
      margin-bottom: 36px;
    }
    /* Admin message */
    .admin-msg {
      background: rgba(15,21,37,0.85); border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px; padding: 18px 22px;
      font-size: 14px; color: rgba(234,240,255,0.5);
      line-height: 1.75; text-align: left;
      display: none; margin-bottom: 34px;
    }
    .admin-msg.visible { display: block; }
    .admin-msg-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.14em;
      text-transform: uppercase; color: rgba(249,115,22,0.65);
      margin-bottom: 8px;
    }
    /* Divider */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.07), transparent);
      margin: 32px 0;
    }
    /* Stats */
    .stats { display: flex; justify-content: center; }
    .stat { flex: 1; text-align: center; padding: 0 24px; border-right: 1px solid rgba(255,255,255,0.06); }
    .stat:last-child { border-right: none; }
    .stat-val { font-family: 'DM Mono', monospace; font-size: 18px; font-weight: 500; color: #eaf0ff; }
    .stat-lbl { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(234,240,255,0.28); margin-top: 5px; }
    /* Admin link */
    .admin-link {
      position: fixed; bottom: 24px; right: 24px;
      display: flex; align-items: center; gap: 8px;
      padding: 9px 18px; border-radius: 10px;
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07);
      color: rgba(234,240,255,0.35); text-decoration: none;
      font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
      transition: all 0.2s; z-index: 100;
    }
    .admin-link:hover { background: rgba(91,110,245,0.08); border-color: rgba(91,110,245,0.25); color: #5b6ef5; }
    @media(max-width:480px) {
      .stat { padding: 0 14px; }
      .stat-val { font-size: 14px; }
    }
  </style>
</head>
<body>

  <div class="grid-bg"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="scanline"></div>

  <div class="content">
    <div class="icon-ring">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18.36 6.64A9 9 0 1 1 5.63 5.63"/>
        <line x1="12" y1="2" x2="12" y2="12"/>
      </svg>
    </div>

    <div><div class="badge"><div class="badge-dot"></div>Maintenance Mode</div></div>

    <div class="main-title" id="pageTitle">Sedang Dalam<br>Pemeliharaan</div>

    <p class="subtitle" id="pageSubtitle">
      Sistem sedang dalam proses pemeliharaan terjadwal.<br>
      Kami akan kembali segera — terima kasih atas kesabarannya.
    </p>

    <div class="admin-msg" id="adminMsg">
      <div class="admin-msg-label">Pesan dari Admin</div>
      <div id="adminMsgText"></div>
    </div>

    <div class="divider"></div>

    <div class="stats">
      <div class="stat">
        <div class="stat-val" id="liveClock">--:--:--</div>
        <div class="stat-lbl">Waktu</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="downtime">--</div>
        <div class="stat-lbl">Downtime</div>
      </div>
      <div class="stat">
        <div class="stat-val" style="color:#ef4444">Offline</div>
        <div class="stat-lbl">Status</div>
      </div>
    </div>
  </div>

  <a href="index.html" class="admin-link">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93l-1.41 1.41M5.34 18.66l-1.41 1.41M20 12h2M2 12h2"/></svg>
    Admin Panel
  </a>

  <script>
    const STORAGE_KEY   = 'academix_shutdown';
    const COUNTDOWN_SEC = 20;
    const getState = () => { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; } };

    function fmt(ms) {
      const s = Math.floor(ms / 1000);
      const m = Math.floor(s / 60);
      const h = Math.floor(m / 60);
      if (h > 0) return h + 'j ' + (m % 60) + 'm';
      if (m > 0) return m + 'm ' + (s % 60) + 's';
      return s + 's';
    }

    function loadContent() {
      const s = getState();
      if (s.message) {
        document.getElementById('adminMsg').classList.add('visible');
        document.getElementById('adminMsgText').textContent = s.message;
      }
    }

    // Live clock & downtime
    setInterval(() => {
      document.getElementById('liveClock').textContent = new Date().toLocaleTimeString('id-ID');
      const s = getState();
      if (s.shutdownStart) {
        document.getElementById('downtime').textContent = fmt(Date.now() - s.shutdownStart);
      }
    }, 1000);

    // Polling: jika shutdown dimatikan admin → redirect ke index
    setInterval(() => {
      const s = getState();
      if (!s.isShutdown) {
        // Website sudah diaktifkan kembali, redirect ke halaman utama
        document.body.style.transition = 'opacity 0.8s ease';
        document.body.style.opacity    = '0';
        setTimeout(() => { window.location.replace('index.html'); }, 800);
      }
    }, 1200);

    loadContent();
  </script>

</body>
</html>
